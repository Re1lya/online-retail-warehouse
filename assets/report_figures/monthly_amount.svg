  <g id="text_20">
   <text style="font-weight: 700; font-size: 20px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #183650" x="56.887188" y="30.07875" transform="rotate(-0 56.887188 30.07875)">月度正向交易金额</text>
  </g>
  <g id="text_21">
   <text style="font-size: 12px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5a6d7b" x="56.887188" y="53.01075" transform="rotate(-0 56.887188 53.01075)">以完整自然月比较趋势；末月仅覆盖 12 月 1—9 日</text>
  </g>
  <g id="text_22">
   <text style="font-size: 11px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5a6d7b" x="56.887188" y="335.25075" transform="rotate(-0 56.887188 335.25075)">浅灰背景与虚线表示不完整月；2010 年 12 月为完整月。</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10.3px; font-family: 'Arial Unicode MS', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5a6d7b" x="56.887188" y="352.89075" transform="rotate(-0 56.887188 352.89075)">口径：包含邮资、手工记账和调整项目；取消记录未冲抵，非净收入。</text>
  </g>
