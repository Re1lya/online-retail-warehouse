<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Online retail warehouse star schema</title>
  <desc id="desc">Four shared dimensions connect to a source-row-grain transaction fact table. Invoice number is a degenerate dimension. The diagram depicts logical relationships.</desc>
  <defs>
    <style>
      .bg{fill:#f3f6fa}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#153650}.facthead{fill:#0b7073}.title{font:700 30px Arial,sans-serif;fill:#153650}.sub{font:17px Arial,sans-serif;fill:#516879}.tbl{font:700 20px Arial,sans-serif;fill:white}.field{font:17px 'Courier New',monospace;fill:#243c4e}.small{font:15px Arial,sans-serif;fill:#516879}.line{fill:none;stroke:#67859b;stroke-width:3}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#67859b" stroke-width="1.5"/></marker>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="52" y="58">Online Retail  /  Star Schema</text>
  <text class="sub" x="52" y="90">Grain: one original transaction row  ·  Amounts: GBP  ·  Unknown dimension member: key 0</text>
  <path class="line" d="M390 252 H440 V292 H482" marker-end="url(#arrow)"/>
  <path class="line" d="M390 558 H440 V379 H482" marker-end="url(#arrow)"/>
  <path class="line" d="M1010 239 H960 V321 H918" marker-end="url(#arrow)"/>
  <path class="line" d="M1010 530 H960 V350 H918" marker-end="url(#arrow)"/>
  <text class="small" x="402" y="239">1</text><text class="small" x="458" y="280">N</text>
  <text class="small" x="402" y="546">1</text><text class="small" x="458" y="399">N</text>
  <text class="small" x="983" y="227">1</text><text class="small" x="925" y="309">N</text>
  <text class="small" x="983" y="553">1</text><text class="small" x="925" y="373">N</text>
  <rect class="card" x="50" y="150" width="340" height="265" rx="12"/>
  <path class="head" d="M62 150 H378 Q390 150 390 162 V202 H50 V162 Q50 150 62 150"/>
  <text class="tbl" x="72" y="184">dim.date</text>
  <text class="field" x="72" y="238">PK  date_key</text>
  <text class="field" x="72" y="270">UK  full_date</text>
  <text class="field" x="72" y="302">    year / quarter</text>
  <text class="field" x="72" y="334">    month / day</text>
  <text class="small" x="72" y="385">Continuous calendar, YYYYMMDD key</text>
  <rect class="card" x="50" y="470" width="340" height="205" rx="12"/>
  <path class="head" d="M62 470 H378 Q390 470 390 482 V522 H50 V482 Q50 470 62 470"/>
  <text class="tbl" x="72" y="504">dim.country</text>
  <text class="field" x="72" y="558">PK  country_key</text>
  <text class="field" x="72" y="590">UK  country</text>
  <text class="small" x="72" y="645">Country from each transaction row</text>
  <rect class="card" x="485" y="150" width="430" height="560" rx="12"/>
  <path class="facthead" d="M497 150 H903 Q915 150 915 162 V202 H485 V162 Q485 150 497 150"/>
  <text class="tbl" x="507" y="184">dwd.fact_transaction</text>
  <text class="field" x="507" y="238">PK  source_row_number</text>
  <text class="field" x="507" y="267">DD  invoice_no</text>
  <text class="field" x="507" y="296">FK  date_key</text>
  <text class="field" x="507" y="325">FK  product_key</text>
  <text class="field" x="507" y="354">FK  customer_key</text>
  <text class="field" x="507" y="383">FK  country_key</text>
  <line x1="507" y1="404" x2="893" y2="404" stroke="#dbe4ea"/>
  <text class="field" x="507" y="438">    invoice_ts</text>
  <text class="field" x="507" y="467">    quantity</text>
  <text class="field" x="507" y="496">    unit_price</text>
  <text class="field" x="507" y="525">    line_amount</text>
  <text class="field" x="507" y="554">    is_cancelled</text>
  <text class="field" x="507" y="583">    is_positive_sale</text>
  <text class="field" x="507" y="612">    is_exact_duplicate</text>
  <text class="small" x="507" y="671">All source rows retained; filter at metric level</text>
  <rect class="card" x="1010" y="150" width="340" height="265" rx="12"/>
  <path class="head" d="M1022 150 H1338 Q1350 150 1350 162 V202 H1010 V162 Q1010 150 1022 150"/>
  <text class="tbl" x="1032" y="184">dim.product</text>
  <text class="field" x="1032" y="238">PK  product_key</text>
  <text class="field" x="1032" y="270">UK  stock_code</text>
  <text class="field" x="1032" y="302">    description</text>
  <text class="small" x="1032" y="355">Latest non-empty description</text>
  <text class="small" x="1032" y="385">SCD Type 1 / full rebuild</text>
  <rect class="card" x="1010" y="470" width="340" height="205" rx="12"/>
  <path class="head" d="M1022 470 H1338 Q1350 470 1350 482 V522 H1010 V482 Q1010 470 1022 470"/>
  <text class="tbl" x="1032" y="504">dim.customer</text>
  <text class="field" x="1032" y="558">PK  customer_key</text>
  <text class="field" x="1032" y="590">UK  customer_id</text>
  <text class="small" x="1032" y="645">No invented customer attributes</text>
  <text class="small" x="52" y="771">PK = primary key    UK = unique business key    FK = logical foreign key    DD = degenerate dimension</text>
</svg>
